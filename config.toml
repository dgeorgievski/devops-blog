baseURL = "https://3bunara.xyz/"
relativeURLs = false
canonifyURLs = true
title = "Dimitar Georgievski"
languageCode = "en-us"
defaultContentLanguage = "en"
copyright = "Copyright &copy; 2024 - Dimitar Georgievski"
theme = "blowfish"

summaryLength = 20
enableEmoji = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  description = "DevSecOps, platform engineering, automation, and applied AI."
  colorScheme = "blowfish"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  mainSections = ["posts"]

[params.author]
  name = "Dimitar Georgievski"
  headline = "DevSecOps, platform engineering, automation, and applied AI."
  bio = "Writing about the practical intersection of DevSecOps and AI."
  links = [
    { github = "https://github.com/dgeorgievski" },
    { linkedin = "https://www.linkedin.com/in/dimitar-georgievski-11a2218/" },
    { x-twitter = "https://twitter.com/3bunara" }
  ]

[params.header]
  layout = "fixed-fill-blur"

[params.footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[params.homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = true

[params.article]
  showAuthor = true
  showDate = true
  showReadingTime = true
  showWordCount = true
  showHeadingAnchors = true
  showPagination = true
  showTaxonomies = true
  showTags = true
  showCategories = true
  sharingLinks = ["linkedin", "x-twitter", "reddit", "email"]

[params.list]
  showSummary = true
  showCards = true
  cardView = true
  groupByYear = true

[[menu.main]]
  name = "Tags"
  pageRef = "tags"
  weight = 20

[[menu.main]]
  name = "About"
  pageRef = "about"
  weight = 30
